name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Build one-file executable
        run: python -m PyInstaller --noconfirm wcl.spec

      - name: Report artifact size
        run: python -c "import pathlib; print(round(pathlib.Path('dist/WCL-Analyzer.exe').stat().st_size / 1e6, 1), 'MB')"

      - uses: actions/upload-artifact@v4
        with:
          name: WCL-Analyzer-windows
          path: dist/WCL-Analyzer.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WCL-Analyzer.exe
